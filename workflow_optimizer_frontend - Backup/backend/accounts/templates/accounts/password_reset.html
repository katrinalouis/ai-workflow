
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .reset-container {
            background: white;
            padding: 35px;
            width: 350px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #26345c;
        }

        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #3730a3;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            color: #4f46e5;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="reset-container">

    <h2>Forgot Password?</h2>

    <p>Enter your registered email address. We will send you a password reset link.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.email }}

        <button type="submit">Send Reset Link</button>
    </form>

    <a href="{% url 'signin' %}">Back to Sign In</a>

</div>

</body>
</html>
